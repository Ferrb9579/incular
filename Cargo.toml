[workspace]
members = ["crates/*", "tools/*"]
resolver = "3"

[package]
name = "incular-workspace-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
autoexamples = false

[lib]
path = "src/lib.rs"

[profile.dev]
incremental = false

[profile.release]
incremental = false

[profile.test]
incremental = false

[profile.bench]
incremental = false

[dev-dependencies]
incular = { path = "crates/incular", default-features = false, features = ["material"] }
serde_json = { workspace = true }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[workspace.dependencies]
incular = { path = "crates/incular", version = "0.1.0" }
incular-android = { path = "crates/incular-android", version = "0.1.0" }
incular-accessibility = { path = "crates/incular-accessibility", version = "0.1.0" }
incular-semantics = { path = "crates/incular-semantics", version = "0.1.0" }
incular-animation = { path = "crates/incular-animation", version = "0.1.0" }
incular-assets = { path = "crates/incular-assets", version = "0.1.0" }
incular-image = { path = "crates/incular-image", version = "0.1.0" }
incular-core = { path = "crates/incular-core", version = "0.1.0" }
incular-config = { path = "crates/incular-config", version = "0.1.0" }
incular-controls = { path = "crates/incular-controls", version = "0.1.0" }
incular-gestures = { path = "crates/incular-gestures", version = "0.1.0" }
incular-layout = { path = "crates/incular-layout", version = "0.1.0" }
incular-navigation = { path = "crates/incular-navigation", version = "0.1.0" }
incular-scroll = { path = "crates/incular-scroll", version = "0.1.0" }
incular-macros = { path = "crates/incular-macros", version = "0.1.0" }
incular-material = { path = "crates/incular-material", version = "0.1.0" }
incular-ios = { path = "crates/incular-ios", version = "0.1.0" }
incular-linux = { path = "crates/incular-linux", version = "0.1.0" }
incular-macos = { path = "crates/incular-macos", version = "0.1.0" }
incular-painting = { path = "crates/incular-painting", version = "0.1.0" }
incular-rendering = { path = "crates/incular-rendering", version = "0.1.0" }
incular-platform = { path = "crates/incular-platform", version = "0.1.0" }
incular-runtime = { path = "crates/incular-runtime", version = "0.1.0" }
incular-text = { path = "crates/incular-text", version = "0.1.0" }
incular-wgpu = { path = "crates/incular-wgpu", version = "0.1.0" }
incular-widgets = { path = "crates/incular-widgets", version = "0.1.0" }
incular-devtools-protocol = { path = "crates/incular-devtools-protocol", version = "0.1.0" }
incular-devtools = { path = "crates/incular-devtools", version = "0.1.0" }
incular-devtools-ui = { path = "tools/incular-devtools", version = "0.1.0" }
incular-windows = { path = "crates/incular-windows", version = "0.1.0" }

wgpu = "30"
wgpu-profiler = "0.28"
# Test/dev-only: WGSL front end for the renderer pipeline-contract tests.
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
winit = "0.30"
raw-window-handle = "0.6"
bytemuck = { version = "1.23", features = ["derive"] }
pollster = "0.4"
# CPU benchmarking (dev-only, per-crate benches).
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# Optional structured logging/spans; zero-cost without a subscriber.
tracing = "0.1"
typed-builder = "0.23.2"
tokio-tungstenite = "0.24"
futures-util = "0.3"
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
# Property testing for correctness-sensitive reconciliation (dev-only).
proptest = "1"

parley = "0.7"
arboard = "3.6"
fontdue = "0.9"
palette = "0.7.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
lyon_tessellation = "1.0"
kurbo = "0.13"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "net", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
stacker = "0.1.25"
tempfile = "3.27"
# Keep the platform-native adapter at the desktop boundary.  The `tokio`
# feature selects AccessKit's Unix Tokio integration instead of its default
# async-io executor, matching Incular's runtime without creating another one.
accesskit = "0.24.1"
accesskit_winit = { version = "0.33.2", default-features = false, features = ["rwh_06", "tokio"] }
directories = "6.0.0"
icu_locale = { version = "2.2.0", features = ["compiled_data"] }
icu_provider = "2.2.0"
icu_decimal = { version = "2.2.0", features = ["compiled_data"] }
icu_datetime = { version = "2.2.0", features = ["compiled_data"] }
icu_plurals = { version = "2.2.0", features = ["compiled_data"] }
icu_segmenter = { version = "2.2.0", features = ["compiled_data"] }
keyboard-types = "0.8.3"
crash-handler = "0.6.2"
minidump-writer = "0.11.0"

# Optimized build with symbols for external profilers (`perf`,samply).
[profile.profiling]
inherits = "release"
debug = true
incremental = false
