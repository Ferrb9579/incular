[features]
devtools = [
    "incular-linux/devtools",
    "incular-windows/devtools",
    "incular-macos/devtools",
    "incular-runtime/devtools",
    "incular-widgets/devtools",
]
default = ["desktop", "controls", "material"]
desktop = ["dep:incular-platform", "dep:incular-wgpu", "dep:incular-linux", "dep:incular-windows", "dep:incular-macos"]
controls = ["dep:incular-controls"]
material = ["controls", "dep:incular-material"]

[dependencies]
incular-accessibility = { workspace = true }
incular-semantics = { workspace = true }
incular-animation = { workspace = true }
incular-assets = { workspace = true }
incular-image = { workspace = true }
incular-core = { workspace = true }
incular-config = { workspace = true }
incular-controls = { workspace = true, optional = true }
incular-material = { workspace = true, optional = true }
incular-gestures = { workspace = true }
incular-layout = { workspace = true }
incular-navigation = { workspace = true }
incular-scroll = { workspace = true }
incular-macros = { workspace = true }
incular-painting = { workspace = true }
incular-rendering = { workspace = true }
incular-platform = { workspace = true, optional = true }
incular-runtime = { workspace = true }
incular-text = { workspace = true }
incular-wgpu = { workspace = true, optional = true }
incular-widgets = { workspace = true }
incular-linux = { workspace = true, optional = true }
incular-windows = { workspace = true, optional = true }
incular-macos = { workspace = true, optional = true }

[dev-dependencies]
directories = { workspace = true }
keyboard-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
[[example]]
name = "performance_gallery"
path = "../../examples/performance_gallery/main.rs"
