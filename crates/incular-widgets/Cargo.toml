[package]
name = "incular-widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Widgets, built-in components, and layout foundations for Incular"
readme = "README.md"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
typed-builder = { workspace = true }
incular-semantics = { workspace = true }
incular-core = { workspace = true }
incular-config = { workspace = true }
incular-gestures = { workspace = true }
incular-layout = { workspace = true }
incular-scroll = { workspace = true }
incular-rendering = { workspace = true }
incular-text = { workspace = true }
incular-devtools-protocol = { workspace = true, optional = true }
icu_segmenter = { workspace = true }
incular-animation = { workspace = true }
incular-image = { workspace = true }
incular-platform = { workspace = true }
serde_json = { workspace = true }
stacker = { workspace = true }

[features]
default = []
# Exposes DevTools introspection APIs (per-element counters, invalidation
# reasons, tree snapshots). Production builds leave this off.
devtools = ["dep:incular-devtools-protocol"]

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "reconciliation"
harness = false

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "semantics"
harness = false

[[bench]]
name = "widget_eq_probe"
harness = false
