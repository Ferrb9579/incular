[package]
name = "incular-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Windows platform integration for Incular"
readme = "README.md"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
incular-desktop = { workspace = true }
incular-runtime = { workspace = true }
incular-widgets = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
crash-handler = { workspace = true }
minidump-writer = { workspace = true }
incular-platform = { workspace = true }
incular-config = { workspace = true }
incular-core = { workspace = true }
winit = { workspace = true }
windows-sys = { workspace = true }
windows = { workspace = true }
raw-window-handle = { workspace = true }
sys-locale = { workspace = true }
tauri-winrt-notification = { workspace = true }
tray-icon = { workspace = true }

[features]
default = []
devtools = ["incular-desktop/devtools"]

[dev-dependencies]
incular-core = { workspace = true }

[[test]]
name = "display_placement"
path = "tests/display_placement.rs"
harness = false

[[test]]
name = "transient_surface"
path = "tests/transient_surface.rs"
harness = false

[[test]]
name = "platform_menu"
path = "tests/platform_menu.rs"
harness = false

[[test]]
name = "system_environment"
path = "tests/system_environment.rs"
harness = false

[[test]]
name = "application_shell"
path = "tests/application_shell.rs"
harness = false
