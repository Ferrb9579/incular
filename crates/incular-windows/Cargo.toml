[package]
name = "incular-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Windows platform integration for Incular"
readme = "README.md"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.cargo-machete]
# The package compiles the shared desktop runner via `#[path = ...]` from the
# Linux crate. cargo-machete intentionally does not scan source outside this
# package root, so these dependencies are real even though it cannot see their
# references.
ignored = [
    "accesskit_winit",
    "arboard",
    "incular-accessibility",
    "incular-config",
    "incular-core",
    "incular-devtools",
    "incular-devtools-protocol",
    "incular-layout",
    "incular-platform",
    "incular-rendering",
    "incular-wgpu",
    "pollster",
    "winit",
]
[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
incular-accessibility = { workspace = true }
incular-core = { workspace = true }
incular-config = { workspace = true }
incular-platform = { workspace = true }
incular-runtime = { workspace = true }
incular-wgpu = { workspace = true }
incular-layout = { workspace = true }
incular-widgets = { workspace = true }
incular-devtools = { workspace = true, optional = true }
incular-devtools-protocol = { workspace = true, optional = true }
incular-rendering = { workspace = true }
winit = { workspace = true }
pollster = { workspace = true }
arboard = { workspace = true }
accesskit_winit = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
crash-handler = { workspace = true }
minidump-writer = { workspace = true }

[features]
default = []
devtools = ["dep:incular-devtools", "dep:incular-devtools-protocol", "incular-runtime/devtools", "incular-widgets/devtools"]
