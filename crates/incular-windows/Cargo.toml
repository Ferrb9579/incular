[package]
name = "incular-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Windows platform integration for Incular"
readme = "README.md"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
incular-desktop = { workspace = true }
incular-runtime = { workspace = true }
incular-widgets = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
crash-handler = { workspace = true }
minidump-writer = { workspace = true }
incular-platform = { workspace = true }
winit = { workspace = true }
windows-sys = { workspace = true }

[features]
default = []
devtools = ["incular-desktop/devtools"]

[[test]]
name = "display_placement"
path = "tests/display_placement.rs"
harness = false
