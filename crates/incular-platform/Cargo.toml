[package]
name = "incular-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared platform abstractions for Incular"
readme = "README.md"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/incular-platform"
keywords = ["gui", "ui", "incular"]
categories = ["gui"]
# Repository tests and galleries are validated from the workspace, not shipped.
include = ["src/**", "README.md", "LICENSE"]
[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
directories = { workspace = true }
incular-config = { workspace = true }
incular-core = { workspace = true }
url = { workspace = true }

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []
