[package]
name = "incular-devtools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Target-side DevTools agent for Incular applications"
readme = "README.md"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/incular-devtools"
keywords = ["gui", "ui", "incular"]
categories = ["gui"]
# Repository tests and galleries are validated from the workspace, not shipped.
include = ["src/**", "README.md", "LICENSE"]
[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
incular-devtools-protocol = { workspace = true }
getrandom = { workspace = true }
incular-runtime = { workspace = true, features = ["devtools"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "macros", "sync", "time"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
directories = { workspace = true }
tempfile = { workspace = true }

[features]
default = []

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []
