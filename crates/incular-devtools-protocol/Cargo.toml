[package]
name = "incular-devtools-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Typed, versioned wire protocol between Incular targets and DevTools"
readme = "README.md"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/incular-devtools-protocol"
keywords = ["gui", "ui", "incular"]
categories = ["gui"]
# Repository tests and galleries are validated from the workspace, not shipped.
include = ["src/**", "README.md", "LICENSE"]
[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []
