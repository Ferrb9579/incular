[package]
name = "incular-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "macOS platform integration for Incular"
readme = "README.md"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
incular-desktop = { workspace = true }
incular-runtime = { workspace = true }
incular-widgets = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
incular-platform = { workspace = true }
incular-config = { workspace = true }
winit = { workspace = true }
objc2 = { workspace = true }
block2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-user-notifications = { workspace = true }
raw-window-handle = { workspace = true }
sys-locale = { workspace = true }
tray-icon = { workspace = true }
url = { workspace = true }

[features]
default = []
devtools = ["incular-desktop/devtools"]

[[test]]
name = "application_shell"
path = "tests/application_shell.rs"
harness = false
