[package]
name = "incular-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Renderer-independent configuration values for Incular"
readme = "README.md"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/incular-config"
keywords = ["gui", "ui", "incular"]
categories = ["gui"]
# Repository tests and galleries are validated from the workspace, not shipped.
include = ["src/**", "README.md", "LICENSE"]
[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
icu_decimal = { workspace = true }
icu_datetime = { workspace = true }
icu_locale = { workspace = true }
icu_plurals = { workspace = true }
icu_provider = { workspace = true }
incular-core = { workspace = true }

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []
