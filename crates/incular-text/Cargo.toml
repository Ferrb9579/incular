[package]
name = "incular-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Text layout and typography foundations for Incular"
readme = "README.md"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/incular-text"
keywords = ["gui", "ui", "incular"]
categories = ["gui"]
# Repository tests and galleries are validated from the workspace, not shipped.
include = ["src/**", "README.md", "LICENSE"]
[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
incular-assets = { workspace = true }
incular-config = { workspace = true }
incular-core = { workspace = true }
incular-rendering = { workspace = true }
parley = { workspace = true }
icu_segmenter = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "text_layout"
harness = false

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []
