[package]
name = "incular-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Application runtime and scheduling foundations for Incular"
readme = "README.md"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/incular-runtime"
keywords = ["gui", "ui", "incular"]
categories = ["gui"]
# Repository tests and galleries are validated from the workspace, not shipped.
include = ["src/**", "README.md", "LICENSE"]
[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
incular-accessibility = { workspace = true }
incular-semantics = { workspace = true }
incular-core = { workspace = true }
incular-config = { workspace = true }
incular-rendering = { workspace = true }
incular-text = { workspace = true }
incular-navigation = { workspace = true }
incular-platform = { workspace = true }
incular-widgets = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
incular-devtools-protocol = { workspace = true, optional = true }

[features]
default = []
devtools = ["incular-widgets/devtools", "dep:incular-devtools-protocol"]

[dev-dependencies]
accesskit = { workspace = true }
incular-controls = { workspace = true }
incular-scroll = { workspace = true }
incular-text = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }
pollster = { workspace = true }
url = { workspace = true }

[[bench]]
name = "signals"
harness = false

[[bench]]
name = "restoration"
harness = false

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []
