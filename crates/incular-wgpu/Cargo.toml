[package]
name = "incular-wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "wgpu rendering backend for Incular"
readme = "README.md"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/incular-wgpu"
keywords = ["gui", "ui", "incular"]
categories = ["gui"]
# Repository tests and galleries are validated from the workspace, not shipped.
include = ["src/**", "README.md", "LICENSE"]
[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
incular-config = { workspace = true }
incular-core = { workspace = true }
incular-assets = { workspace = true }
incular-image = { workspace = true }
incular-rendering = { workspace = true }
incular-platform = { workspace = true }
wgpu = { workspace = true }
wgpu-profiler = { workspace = true }
bytemuck = { workspace = true }
fontdue = { workspace = true }
lyon_tessellation = { workspace = true }
kurbo = { workspace = true }

[dev-dependencies]
raw-window-handle = { workspace = true }
trybuild = { workspace = true }
incular-text = { workspace = true }
criterion = { workspace = true }
# Backend residency tests acquire a headless device for real page
# textures; dev-dependencies are excluded from the reviewed boundary.
pollster = { workspace = true }

[[bench]]
name = "path_tessellation"
harness = false

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []
