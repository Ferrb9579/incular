[package]
name = "incular-controls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Platform-neutral default styled controls and design tokens for the Incular framework"
readme = "README.md"
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/incular-controls"
keywords = ["gui", "ui", "incular"]
categories = ["gui"]
# Repository tests and galleries are validated from the workspace, not shipped.
include = ["src/**", "README.md", "LICENSE"]
[lints]
workspace = true

[dependencies]
typed-builder = { workspace = true }
incular-core = { workspace = true }
incular-config = { workspace = true }
incular-rendering = { workspace = true }
incular-text = { workspace = true }
incular-semantics = { workspace = true }
incular-scroll = { workspace = true }
incular-widgets = { workspace = true }

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []
