# Workspace-wide build configuration.
#
# Incremental compilation is strictly disabled for every build, test, example,
# and benchmark. This ensures deterministic compilation and prevents target/
# directory cache explosion across the workspace's crates and targets.

[build]
incremental = false

[env]
CARGO_INCREMENTAL = "0"
# Keep the stock libtest fallback bounded as well. Contributors can override
# this explicitly for a local experiment, but the repository default is safe.
RUST_TEST_THREADS = "1"

[alias]
# Keep the workspace test command sequential without changing Cargo's normal
# build parallelism.
test-constrained = "test --workspace -- --test-threads=1"
