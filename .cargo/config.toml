# Workspace-wide build configuration.
#
# Incremental compilation is strictly disabled for every build, test, example,
# and benchmark. This ensures deterministic compilation and prevents target/
# directory cache explosion across the workspace's crates and targets.

[build]
# Keep clean workspace builds within a predictable memory envelope without
# making them needlessly serial. Rustc and the native linker can each consume
# several GiB for the facade and renderer crates, so do not scale jobs with the
# host CPU count.
jobs = 4
incremental = false

[env]
CARGO_INCREMENTAL = "0"
# Keep the stock libtest fallback bounded as well. Contributors can override
# this explicitly for a local experiment, but the repository default is safe.
RUST_TEST_THREADS = "1"

[alias]
# Bound compilation/linking; RUST_TEST_THREADS above bounds test execution.
# Keeping harness arguments out of the alias lets callers append Cargo options
# such as --all-features without accidentally passing them to libtest.
test-constrained = "test --workspace --jobs 16"
# Escape hatch for unusually memory-heavy compiler or linker regressions. This
# retains the normal full-debug test profile while allowing only one rustc.
test-sequential = "test --workspace --jobs 1"
