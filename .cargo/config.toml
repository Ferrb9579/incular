# Workspace-wide build configuration.
#
# Incremental compilation is disabled for every build (profiles also set
# `incremental = false`). This trades slightly slower rebuilds for a much
# smaller target/ directory: incremental caches had grown target/debug by
# gigabytes of retained artifacts across the workspace's many crates,
# examples, and test targets.
[env]
CARGO_INCREMENTAL = "0"
