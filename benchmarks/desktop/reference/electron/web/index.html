<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loading issue tracker</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        background: #fff;
        color: #20242c;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: default;
      }
      .sidebar {
        width: 176px;
        flex-shrink: 0;
        padding: 24px 12px;
        background: #f4f5f7;
        border-right: 1px solid #e2e5eb;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .brand {
        font-size: 22px;
        font-weight: 700;
        padding: 0 12px;
        margin-bottom: 6px;
      }
      .caption {
        color: #737c8c;
        font-size: 12px;
      }
      .sidebar .caption {
        padding: 0 12px;
        margin-bottom: 24px;
      }
      .nav {
        text-align: left;
        padding: 12px;
        border: 0;
        border-radius: 7px;
        background: transparent;
      }
      .nav[aria-pressed="true"] {
        color: #285bd4;
        background: #e4ebfb;
        font-weight: 600;
      }
      .nav:hover {
        background: #e8ebf1;
      }
      .bottom {
        margin-top: auto;
        padding: 12px;
        color: #737c8c;
        font-size: 12px;
        line-height: 18px;
      }
      .main {
        display: flex;
        flex: 1;
        min-width: 0;
        flex-direction: column;
      }
      .toolbar {
        height: 94px;
        flex-shrink: 0;
        padding: 20px 24px;
        border-bottom: 1px solid #e2e5eb;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 24px;
        font-weight: 700;
      }
      #search {
        width: 280px;
        height: 38px;
        padding: 0 12px;
        background: #f8f9fb;
        border: 1px solid #dce0e7;
        border-radius: 7px;
        outline-color: #285bd4;
      }
      .content {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .inbox {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .list-header,
      .pagination {
        height: 48px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
      }
      .list-header {
        border-bottom: 1px solid #e2e5eb;
        background: #fafbfc;
        font-size: 12px;
        color: #737c8c;
      }
      #issues {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      .issue-row {
        width: 100%;
        height: 68px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        padding: 0 20px;
        text-align: left;
        border: 0;
        border-bottom: 1px solid #edf0f4;
        background: #fff;
      }
      .issue-row:hover {
        background: #f7f9fc;
      }
      .issue-row[aria-pressed="true"] {
        background: #edf3ff;
      }
      .row-title {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
      }
      .row-meta {
        font-size: 11px;
        color: #737c8c;
        white-space: nowrap;
      }
      .pagination {
        height: 58px;
        border-top: 1px solid #e2e5eb;
        font-size: 12px;
      }
      .buttons {
        display: flex;
        gap: 8px;
      }
      .control {
        height: 32px;
        padding: 0 12px;
        border: 1px solid #dce0e7;
        border-radius: 6px;
        background: #fff;
      }
      .control:disabled {
        opacity: 0.4;
      }
      .details {
        width: 350px;
        flex-shrink: 0;
        border-left: 1px solid #e2e5eb;
        overflow-y: auto;
        padding: 24px;
      }
      h2 {
        font-size: 21px;
        line-height: 28px;
        margin: 14px 0 22px;
      }
      .metadata {
        display: flex;
        flex-direction: column;
        gap: 12px;
        font-size: 12px;
        margin-bottom: 24px;
      }
      .property {
        display: flex;
        justify-content: space-between;
      }
      .property span:first-child {
        color: #737c8c;
      }
      .property span:last-child {
        font-weight: 500;
      }
      #description {
        font-size: 13px;
        line-height: 20px;
        white-space: pre-wrap;
        margin: 0 0 22px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      #notes {
        width: 100%;
        height: 100px;
        padding: 10px;
        font-size: 13px;
        line-height: 19px;
        resize: none;
        border: 1px solid #dce0e7;
        border-radius: 7px;
        outline-color: #285bd4;
      }
      #complete {
        width: 100%;
        height: 36px;
        border: 0;
        border-radius: 7px;
        margin-top: 16px;
        color: #fff;
        background: #285bd4;
        font-weight: 500;
      }
      .session-note {
        font-size: 11px;
        color: #737c8c;
        margin-top: 10px;
      }
      #empty {
        padding: 24px;
        color: #737c8c;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">Orbit</div>
      <div class="caption">Product workspace</div>
      <button class="nav" data-filter="All issues">All issues</button>
      <button class="nav" data-filter="Open">Open</button>
      <button class="nav" data-filter="Completed">Completed</button>
      <div class="bottom">September cycle<br />4 projects · 5 teammates</div>
    </aside>
    <main class="main">
      <header class="toolbar">
        <div>
          <h1>Issue inbox</h1>
          <div id="workspace-summary" class="caption"></div>
        </div>
        <input
          id="search"
          aria-label="Search issues"
          placeholder="Search issues, projects, people"
        />
      </header>
      <div class="content">
        <section class="inbox" aria-label="Issue list">
          <div class="list-header"><span id="results"></span><span>Updated this week</span></div>
          <div id="issues"></div>
          <div id="empty" hidden>No matching issues</div>
          <footer class="pagination">
            <span id="page-info"></span>
            <div class="buttons">
              <button id="previous" class="control">Previous</button
              ><button id="next" class="control">Next</button>
            </div>
          </footer>
        </section>
        <aside class="details" aria-label="Issue details">
          <div id="detail-id" class="caption"></div>
          <h2 id="detail-title"></h2>
          <div class="metadata">
            <div class="property"><span>Status</span><span id="detail-status"></span></div>
            <div class="property"><span>Assignee</span><span id="detail-owner"></span></div>
            <div class="property"><span>Priority</span><span id="detail-priority"></span></div>
          </div>
          <p id="description"></p>
          <label for="notes">Working notes</label><textarea id="notes"></textarea
          ><button id="complete"></button>
          <div class="session-note">Changes are kept for this session.</div>
        </aside>
      </div>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
